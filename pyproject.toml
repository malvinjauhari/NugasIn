[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[project]
name = "tugasin-engine"
version = "0.1.0"
description = "Document engine for TugasIn academic document builder"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "TugasIn" }
]
dependencies = [
    "pydantic>=2.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.2.0",
    "mypy>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = "engine.tests.*"
disable_error_code = ["comparison-overlap"]

[[tool.mypy.overrides]]
module = "engine.generators.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
